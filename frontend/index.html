<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Расписание университета</title>

    <link rel="stylesheet" href="styles.css">
    
</head>

<body>

    <div class="page">

        <header class="page-header">

            <a class="brand" href="#" aria-label="Расписание университета">

                <span class="brand__icon" aria-hidden="true">

                    <svg viewBox="0 0 24 24" fill="none">

                        <path
                            d="M7 3V6M17 3V6M4.5 9H19.5M6 5H18C19.1 5 20 5.9 20 7V19C20 20.1 19.1 21 18 21H6C4.9 21 4 20.1 4 19V7C4 5.9 4.9 5 6 5Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        
                    </svg>
                </span>

                <span class="brand__text">

                    <strong>Расписание университета</strong>
                </span>
            </a>
        </header>

        <main class="page-main">

            <div class="background-shape background-shape--left" aria-hidden="true"></div>

            <div class="background-shape background-shape--right" aria-hidden="true"></div>

            <section class="login-card" aria-labelledby="login-title">

                <div class="login-card__badge" aria-hidden="true">

                    <svg viewBox="0 0 24 24" fill="none">

                        <path
                            d="M8 10V8C8 5.79 9.79 4 12 4C14.21 4 16 5.79 16 8V10M7 10H17C18.1 10 19 10.9 19 12V18C19 19.1 18.1 20 17 20H7C5.9 20 5 19.1 5 18V12C5 10.9 5.9 10 7 10Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        
                    </svg>
                </div>

                <div class="login-card__heading">

                    <h1 class="login-card__title" id="login-title">Вход в систему</h1>

                    <p class="login-card__subtitle">
                        
                        Введите логин и пароль, выданные администратором.
                    </p>
                </div>

                <div
                    class="message message--error"
                    id="login-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                >

                    <span class="message__icon" aria-hidden="true">!</span>

                    <div class="message__text">

                        <strong id="message-title">Неверный логин или пароль</strong>

                        <span id="message-description">Проверьте данные и попробуйте снова</span>
                        
                    </div>
                </div>

                <form class="login-form" id="login-form" novalidate>

                    <div class="form-field">

                        <label class="form-field__label" for="login">Логин</label>

                        <div class="form-field__control">

                            <span class="form-field__icon" aria-hidden="true">

                                <svg viewBox="0 0 24 24" fill="none">

                                    <path
                                        d="M19 20C19 16.69 15.87 14 12 14C8.13 14 5 16.69 5 20M12 11C14.21 11 16 9.21 16 7C16 4.79 14.21 3 12 3C9.79 3 8 4.79 8 7C8 9.21 9.79 11 12 11Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linecap="round"
                                    />
                                    
                                </svg>
                            </span>

                            <input
                                class="form-field__input"
                                id="login"
                                name="login"
                                type="text"
                                autocomplete="username"
                                placeholder="Введите логин"
                                required
                            >

                        </div>

                        <span class="form-field__error" id="login-error" hidden>

                            Введите логин
                        </span>
                    </div>

                    <div class="form-field">

                        <label class="form-field__label" for="password">Пароль</label>

                        <div class="form-field__control">

                            <span class="form-field__icon" aria-hidden="true">

                                <svg viewBox="0 0 24 24" fill="none">

                                    <path
                                        d="M8 10V8C8 5.79 9.79 4 12 4C14.21 4 16 5.79 16 8V10M7 10H17C18.1 10 19 10.9 19 12V18C19 19.1 18.1 20 17 20H7C5.9 20 5 19.1 5 18V12C5 10.9 5.9 10 7 10Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                    
                                </svg>
                            </span>

                            <input
                                class="form-field__input"
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Введите пароль"
                                required
                            >

                        </div>

                        <span class="form-field__error" id="password-error" hidden>
                            
                            Введите пароль
                        </span>
                    </div>

                    <button class="login-button" id="login-button" type="submit">

                        Войти
                    </button>
                </form>

                <div class="login-card__help">

                    <span class="login-card__help-icon" aria-hidden="true">?</span>

                    <p>
                        
                        Нет доступа или забыли пароль?<br>
                        Обратитесь к администратору системы.
                    </p>
                </div>
            </section>
        </main>

        <footer class="page-footer">

            <span>
                
                Администратор системы:

                <a href="mailto:admin@mail.ru">[Email]</a>

            </span>
        </footer>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>

</body>
</html>
