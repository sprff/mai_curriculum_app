          description: Derived from teacher_subjects; not a column in teachers.
          items:
            $ref: '#/components/schemas/DatabaseId'
    CreateTeacherRequest:
      type: object
      required:
      - name
      - subjectIds
      properties:
        name:
          type: string
          minLength: 1
        userId:
          type:
          - integer
          - 'null'
          format: int32
        subjectIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DatabaseId'
    UpdateTeacherRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        userId:
          type:
          - integer
          - 'null'
          format: int32
          description: Set null to clear teachers.user_id.
        subjectIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DatabaseId'
    TeacherCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Teacher'
    Lesson:
      type: object
      required:
      - id
      - requirementId
      - occurrenceIndex
      - date
      - lessonNumber
      - groupId
