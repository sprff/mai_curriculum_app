      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    GenerationJobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
    ImportEntityType:
      type: string
      enum:
      - classrooms
      - groups
      - lessonRequirements
      - subjects
      - teachers
    AvailabilityState:
      type: string
      enum:
      - available
      - unavailable
      - preferred
    ScheduleChangeType:
      type: string
      enum:
      - added
      - removed
      - changed
    GenerationIssueSeverity:
      type: string
      enum:
      - error
      - warning
    SchedulePeriod:
      type: object
      required:
      - id
      - name
      - startsOn
      - endsOn
      - isActive
      - publishedVersionId
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
        name:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        isActive:
          type: boolean
        publishedVersionId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
      description: Academic period selected in schedule and version screens. Requires academic_periods.
      x-db-table: academic_periods
      x-requires-db-migration: true
    SchedulePeriodCollection:
      type: object
