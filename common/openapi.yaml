          format: date
        lessonNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
        groupId:
          $ref: '#/components/schemas/DatabaseId'
        teacherId:
          $ref: '#/components/schemas/DatabaseId'
        classroomId:
          $ref: '#/components/schemas/DatabaseId'
        subjectId:
          $ref: '#/components/schemas/DatabaseId'
        lessonType:
          $ref: '#/components/schemas/LessonType'
        groupName:
