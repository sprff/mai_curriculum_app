      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
        offset:
          type: integer
          format: int32
          minimum: 0
    UserCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/User'
    AdminDashboard:
