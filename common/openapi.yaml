          $ref: '#/components/responses/UnexpectedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationJobRequest'
      x-required-roles:
      - admin
  /admin/generation-jobs/{jobId}:
    get:
      tags:
      - Generation
      operationId: GetGenerationJob
      description: Returns the current generation job state and progress for polling.
      responses:
        '200':
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-required-roles:
      - admin
  /admin/generation-jobs/{jobId}/cancel:
    post:
      tags:
      - Generation
      operationId: CancelGenerationJob
      description: Requests cancellation of a queued or running job.
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-required-roles:
      - admin
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      description: Case-insensitive search over the entity's display name or identifier.
      schema:
        type: string
        maxLength: 200
    GroupId:
      name: groupId
      in: query
      schema:
        $ref: '#/components/schemas/DatabaseId'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    DayOfWeek:
      name: dayOfWeek
      in: query
      description: ISO weekday derived from lessons.date; the timetable uses Monday through Saturday.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 6
  responses:
    BadRequest:
      description: Invalid request syntax or parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    Forbidden:
      description: The account does not have access to this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    Conflict:
      description: Resource conflicts with an existing database relationship or state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    UnprocessableEntity:
      description: Request is valid JSON but violates a domain constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    UnexpectedError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    PayloadTooLarge:
      description: Uploaded file exceeds the configured size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    PublishRejected:
      description: Version contains blocking conflicts and remains a draft.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishRejected'
  schemas:
    DatabaseId:
      type: integer
      format: int32
      minimum: 1
      description: Positive PostgreSQL serial/integer identifier.
    UserRole:
      type: string
      enum:
      - admin
      - teacher
      - student
      description: Values of the users.role database enum.
    LessonType:
      type: string
      enum:
      - lection
      - practice
      - lab work
      description: Values of the lessons.lesson_type database enum.
    ScheduleVersionStatus:
      type: string
      enum:
      - draft
      - published
      - archived
      description: Values of the lessons_versions.status database enum.
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          writeOnly: true
    AuthResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int32
          minimum: 1
          description: Access-token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - role
      - name
      - login
      - email
      - groupId
      - teacherId
      - isActive
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
        role:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
        login:
          type: string
        email:
          type: string
          format: email
        groupId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Stored users.group_id.
        teacherId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Derived through teachers.user_id; there is no users.teacher_id column.
        isActive:
          type: boolean
          description: Account login is allowed only while true. Requires the users.is_active migration.
          x-requires-db-migration: true
      description: Account fields map to users; teacherId is derived through teachers.user_id.
      x-db-table: users
      x-requires-db-migration: true
    CreateUserRequest:
      type: object
      required:
      - role
      - name
      - login
      - email
      - password
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        groupId:
          type:
          - integer
          - 'null'
          format: int32
          description: Required for student accounts; maps to users.group_id.
        teacherId:
          type:
          - integer
          - 'null'
          format: int32
          description: Required for teacher accounts; links through teachers.user_id.
      description: For student, groupId is required. For teacher, teacherId must identify an unlinked teacher profile.
    UpdateUserRequest:
      type: object
      required: []
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        groupId:
          type:
          - integer
          - 'null'
          format: int32
        teacherId:
          type:
          - integer
          - 'null'
          format: int32
        isActive:
          type: boolean
          description: False disables login while preserving the account.
      description: Only supplied fields are updated; changing role also requires valid role-specific links.
      minProperties: 1
    Group:
      type: object
      required:
      - id
      - groupName
      - studentCount
      - weeklyLessonCount
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
        groupName:
          type: string
        studentCount:
          type: integer
          format: int32
          minimum: 1
          x-requires-db-migration: true
        weeklyLessonCount:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: Sum of lessonsPerWeek for this group's requirements in the active academic period; displayed in the groups table.
      description: Student count is entered explicitly. Weekly lesson count is derived from lesson requirements.
      x-db-table: groups
      x-requires-db-migration: true
    GroupWriteRequest:
      type: object
      required:
      - groupName
      - studentCount
      properties:
        groupName:
          type: string
          minLength: 1
        studentCount:
          type: integer
          format: int32
          minimum: 1
    GroupCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Group'
    Subject:
      type: object
      required:
      - id
      - name
      - code
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
        name:
          type: string
        code:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Optional unique internal code shown in the mockup.
          x-requires-db-migration: true
      description: The weekly lesson count belongs to a group-specific lesson requirement, not to the subject.
      x-db-table: subjects
      x-requires-db-migration: true
    SubjectWriteRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        code:
          type:
          - string
          - 'null'
          maxLength: 100
    UpdateSubjectRequest:
      type: object
      required: []
      properties:
        name:
          type: string
          minLength: 1
        code:
          type:
          - string
          - 'null'
          maxLength: 100
      minProperties: 1
    SubjectCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Subject'
    Classroom:
      type: object
      required:
      - id
      - roomNumber
      - capacity
      - isActive
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
        roomNumber:
          type: string
          maxLength: 10
        capacity:
          type: integer
          format: int32
          minimum: 1
        isActive:
          type: boolean
          description: Inactive classrooms cannot be assigned to new lessons.
          x-requires-db-migration: true
      description: Requires the classrooms.active column; floor is not part of the mockup or target API.
      x-db-table: classrooms
      x-requires-db-migration: true
    ClassroomWriteRequest:
      type: object
      required:
      - roomNumber
      - capacity
      - isActive
      properties:
        roomNumber:
          type: string
          minLength: 1
          maxLength: 10
        capacity:
          type: integer
          format: int32
          minimum: 1
        isActive:
          type: boolean
    UpdateClassroomRequest:
      type: object
      required: []
      properties:
        roomNumber:
          type: string
          minLength: 1
          maxLength: 10
        capacity:
          type: integer
          format: int32
          minimum: 1
        isActive:
          type: boolean
      minProperties: 1
    ClassroomCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Classroom'
    Teacher:
      type: object
