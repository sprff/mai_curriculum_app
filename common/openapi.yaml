          readOnly: true
        teacherName:
          type: string
          readOnly: true
        roomNumber:
          type: string
          readOnly: true
        subjectName:
          type: string
          readOnly: true
        dayOfWeek:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
