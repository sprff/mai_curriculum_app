          - teachers
          - classrooms
          - subjects
          - lessonRequirements
          properties:
            groups:
              type: integer
              format: int64
              minimum: 0
            teachers:
              type: integer
              format: int64
              minimum: 0
            classrooms:
              type: integer
              format: int64
              minimum: 0
            subjects:
              type: integer
              format: int64
              minimum: 0
            lessonRequirements:
              type: integer
              format: int64
              minimum: 0
