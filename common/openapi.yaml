openapi: 3.1.0
info:
  title: MAI Timetable API
  version: 1.0.0
  description: Target frontend/backend contract for the timetable product. The supplied database description does
    not contain several fields and entities required by the mockup; required schema changes are documented in docs/API_CONTRACT.md.
    This file excludes the backend-to-generator protocol.
servers:
- url: http://localhost:8080/api/v1
  description: Local backend
security:
- BearerAuth: []
tags:
- name: Health
- name: Authentication
- name: Dashboard
- name: Users
- name: Reference data
- name: Lesson requirements
- name: Teacher availability
- name: Imports
- name: Generation
- name: Schedule versions
- name: Personal schedule
paths:
  /ping:
    get:
      tags:
      - Health
      operationId: Ping
      security: []
      responses:
        '200':
          description: Backend is available.
          content:
            application/json:
              schema:
                type: string
              example: pong
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: AuthLogin
<<<<<<< Updated upstream
      description: Authenticate with login and password.
=======
      security: []
>>>>>>> Stashed changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token, refresh token, and account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Authenticates by login/password. Disabled accounts receive 403 with code ACCOUNT_DISABLED.
  /auth/refresh:
    post:
      tags:
      - Authentication
      operationId: AuthRefresh
      security: []
      description: Refresh-token lifecycle is handled by the auth layer; it is not stored in the timetable tables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
<<<<<<< Updated upstream
          $ref: '#/components/responses/TokensIssued'
        '400':
          $ref: '#/components/responses/BadRequest'

=======
          description: Rotated tokens and current account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/me:
    get:
      tags:
      - Authentication
      operationId: GetCurrentUser
      responses:
        '200':
          description: Current account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
      x-required-roles:
      - admin
      - teacher
      - student
  /admin/dashboard:
    get:
      tags:
      - Dashboard
      operationId: GetAdminDashboard
      description: Reference-data counts and the published version for the requested or active academic period.
      parameters:
      - name: periodId
        in: query
        required: false
        description: Academic period to show. If omitted, the active period is used.
        schema:
          $ref: '#/components/schemas/DatabaseId'
      responses:
        '200':
          description: Current database-backed summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /users:
    get:
      tags:
      - Users
      operationId: ListUsers
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: isActive
        in: query
        schema:
          type: boolean
        description: Filter by account state; omit to include both enabled and disabled accounts.
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    post:
      tags:
      - Users
      operationId: CreateUser
      description: Creates an account. For a student, groupId is required; for a teacher, teacherId links an existing
        teacher profile through teachers.user_id. Password is hashed by the backend and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Users
      operationId: GetUser
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Users
      operationId: UpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
      description: Updates supplied account fields only. Set groupId or teacherId to null to clear the link; isActive=false
        disables login without deleting the account.
    delete:
      tags:
      - Users
      operationId: DeleteUser
      responses:
        '204':
          description: Account deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /groups:
    get:
      tags:
      - Reference data
      operationId: ListGroups
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of student groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    post:
      tags:
      - Reference data
      operationId: CreateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWriteRequest'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /groups/{groupId}:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Reference data
      operationId: GetGroup
      responses:
        '200':
          description: Group data, including the manually maintained student count and the active-period weekly lesson count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Reference data
      operationId: UpdateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    delete:
      tags:
      - Reference data
      operationId: DeleteGroup
      responses:
        '204':
          description: Group deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Group is still referenced by users or lessons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /subjects:
    get:
      tags:
      - Reference data
      operationId: ListSubjects
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    post:
      tags:
      - Reference data
      operationId: CreateSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWriteRequest'
      responses:
        '201':
          description: Subject created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /subjects/{subjectId}:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Reference data
      operationId: GetSubject
      responses:
        '200':
          description: Subject details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Reference data
      operationId: UpdateSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubjectRequest'
      responses:
        '200':
          description: Updated subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    delete:
      tags:
      - Reference data
      operationId: DeleteSubject
      responses:
        '204':
          description: Subject deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Subject is still referenced by teachers or lessons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /classrooms:
    get:
      tags:
      - Reference data
      operationId: ListClassrooms
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: isActive
        in: query
        schema:
          type: boolean
        description: Filter by active state; omit to include active and inactive rooms.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of classrooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    post:
      tags:
      - Reference data
      operationId: CreateClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomWriteRequest'
      responses:
        '201':
          description: Classroom created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
      description: Creates a classroom with room number, capacity, and active state as shown in the mockup.
  /classrooms/{classroomId}:
    parameters:
    - name: classroomId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Reference data
      operationId: GetClassroom
      responses:
        '200':
          description: Classroom details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Reference data
      operationId: UpdateClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassroomRequest'
      responses:
        '200':
          description: Updated classroom.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    delete:
      tags:
      - Reference data
      operationId: DeleteClassroom
      responses:
        '204':
          description: Classroom deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Classroom is still referenced by lessons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /teachers:
    get:
      tags:
      - Reference data
      operationId: ListTeachers
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: subjectId
        in: query
        schema:
          $ref: '#/components/schemas/DatabaseId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of teachers with subject links read from teacher_subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    post:
      tags:
      - Reference data
      operationId: CreateTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherRequest'
      responses:
        '201':
          description: Teacher profile and teacher_subjects links created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /teachers/{teacherId}:
    parameters:
    - name: teacherId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Reference data
      operationId: GetTeacher
      responses:
        '200':
          description: Teacher profile and linked subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Reference data
      operationId: UpdateTeacher
      description: If subjectIds is present, it replaces the teacher_subjects rows for this teacher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherRequest'
      responses:
        '200':
          description: Updated teacher profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    delete:
      tags:
      - Reference data
      operationId: DeleteTeacher
      responses:
        '204':
          description: Teacher deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Teacher is still referenced by lessons or an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /schedule-versions:
    get:
      tags:
      - Schedule versions
      operationId: ListScheduleVersions
      parameters:
      - name: periodId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DatabaseId'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ScheduleVersionStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of versions linked to the requested academic period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleVersionCollection'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Lists schedule versions for one academic period. Generation metrics are derived or read from
        the stored generation snapshot.
      x-required-roles:
      - admin
  /schedule-versions/compare:
    get:
      tags:
      - Schedule versions
      operationId: CompareScheduleVersions
      description: Compares requirements occurrences using the stable key (requirementId, weekStartDate, occurrenceIndex).
        The source database has no such requirement/occurrence key; it is part of the required schema extension.
      parameters:
      - name: versionAId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DatabaseId'
      - name: versionBId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DatabaseId'
      responses:
        '200':
          description: Lessons present in only one of the selected versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleComparison'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /schedule-versions/{versionId}:
    parameters:
    - name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DatabaseId'
    get:
      tags:
      - Schedule versions
      operationId: GetScheduleVersion
      responses:
        '200':
          description: Version metadata and derived lesson count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    patch:
      tags:
      - Schedule versions
      operationId: RenameScheduleVersion
      description: Only the stored version name is editable through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameScheduleVersionRequest'
      responses:
        '200':
          description: Renamed version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
    delete:
      tags:
      - Schedule versions
      operationId: DeleteScheduleVersion
      description: Only a draft version that is not the published version can be deleted.
      responses:
        '204':
          description: Draft deleted with its lesson-version links.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - admin
  /schedule-versions/{versionId}/copy:
    post:
      tags:
      - Schedule versions
      operationId: CopyScheduleVersion
      description: Creates a draft that initially links the source lesson rows. Before a shared lesson is edited,
        the backend performs copy-on-write so another version's schedule is unchanged.
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DatabaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyScheduleVersionRequest'
      responses:
        '201':
          description: Independent draft copy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
