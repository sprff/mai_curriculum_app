      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    CopyScheduleVersionRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    ScheduleVersionCollection:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ScheduleVersion'
    ScheduleComparison:
      type: object
      required:
      - versionA
      - versionB
      - differentAssignmentCount
      - changes
      properties:
        versionA:
          $ref: '#/components/schemas/ScheduleVersion'
        versionB:
          $ref: '#/components/schemas/ScheduleVersion'
        differentAssignmentCount:
          type: integer
          format: int64
          minimum: 0
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleChange'
    ScheduleValidation:
      type: object
      required:
      - versionId
      - isPublishable
      - conflicts
      properties:
        versionId:
          $ref: '#/components/schemas/DatabaseId'
        isPublishable:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleConflict'
    ScheduleConflict:
      type: object
      required:
      - code
      - severity
      - message
      - lessonIds
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - blocking
          - warning
        message:
          type: string
        lessonIds:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseId'
          uniqueItems: true
        groupId:
          oneOf:
          - $ref: '#/components/schemas/DatabaseId'
          - type: 'null'
        teacherId:
          oneOf:
          - $ref: '#/components/schemas/DatabaseId'
          - type: 'null'
        classroomId:
          oneOf:
          - $ref: '#/components/schemas/DatabaseId'
          - type: 'null'
        date:
          type:
          - string
          - 'null'
          format: date
        lessonNumber:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 7
      description: Conflict details are computed at read/publish time.
    ScheduleView:
      type: object
      required:
      - version
      - weekStartDate
      - weekEndDate
      - lessons
      - weekMetrics
