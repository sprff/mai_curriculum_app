    LessonWriteRequest:
      type: object
      required:
      - requirementId
      - occurrenceIndex
      - date
      - lessonNumber
      - classroomId
      properties:
        requirementId:
          $ref: '#/components/schemas/DatabaseId'
        occurrenceIndex:
