      description: 'Ответ на запуск генерации: номер созданной задачи.'
      properties:
        job_id:
          title: Job Id
          type: string
      required:
        - job_id
      title: JobCreated
      type: object
    JobState:
      description: Состояние задачи, которое можно безопасно вернуть вызывающему коду
      properties:
        cancel_requested:
          title: Cancel Requested
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        error:
          anyOf:
            - type: string
            - type: "null"
          title: Error
        finished_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          title: Finished At
        id:
          title: Id
          type: string
        progress_placed:
          title: Progress Placed
          type: integer
        progress_total:
          title: Progress Total
          type: integer
        result:
          anyOf:
            - items:
                $ref: '#/components/schemas/Lesson'
              type: array
            - type: "null"
          title: Result
        started_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          title: Started At
        status:
          title: Status
          type: string
      required:
        - id
        - status
        - created_at
        - started_at
        - finished_at
        - progress_placed
        - progress_total
        - error
        - result
        - cancel_requested
      title: JobState
      type: object
    Lesson:
      description: 'Одна поставленная пара. day: 0 = понедельник.'
      properties:
        classroom_id:
          title: Classroom Id
          type: integer
        day:
          title: Day
          type: integer
        group_id:
          title: Group Id
          type: integer
        lesson_number:
          title: Lesson Number
          type: integer
        subject_id:
          title: Subject Id
          type: integer
        teacher_id:
          title: Teacher Id
          type: integer
      required:
        - day
        - lesson_number
        - group_id
        - subject_id
        - teacher_id
        - classroom_id
      title: Lesson
      type: object
    ValidationIssues:
      description: Ответ, если валидатор нашёл проблемы в данных.
      properties:
        issues:
          items:
            $ref: '#/components/schemas/ValidationIssue'
          title: Issues
          type: array
      required:
        - issues
      title: ValidationIssues
      type: object
    ValidationIssue:
      description: 'Проблема в данных: код и текст ошибки.'
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
        - code
        - message
      title: ValidationIssue
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
          additionalProperties:
            x-ogen-type: encoding/json.RawMessage
        input:
          title: Input
          description: The original value rejected by core validation; may be any JSON value.
          x-ogen-type: encoding/json.RawMessage
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
    EntityId:
      type: integer
      format: int64
      minimum: 1
      example: 1
    Classroom:
      type: object
      required:
        - id
        - capacity
        - room_number
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
          readOnly: true
        capacity:
          type: integer
          format: int32
          minimum: 1
          example: 24
        room_number:
          type: string
          minLength: 1
          example: '202'
    ClassroomInput:
      type: object
      required:
        - capacity
        - room_number
      properties:
        capacity:
          type: integer
          format: int32
          minimum: 1
        room_number:
          type: string
          minLength: 1
          example: '202'
    Subject:
      type: object
      required:
        - id
        - name
        - weekly_number_of_lessons
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
          readOnly: true
        name:
          type: string
          minLength: 1
          example: 'Математический анализ'
        weekly_number_of_lessons:
          type: integer
          format: int32
          minimum: 1
    SubjectInput:
      type: object
      required:
        - name
        - weekly_number_of_lessons
      properties:
        name:
          type: string
          minLength: 1
          example: 'Математический анализ'
        weekly_number_of_lessons:
          type: integer
          format: int32
          minimum: 1
    Group:
      type: object
      required:
        - id
        - group_name
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
          readOnly: true
        group_name:
          type: string
          minLength: 1
          example: 'ИВТ-101'
    GroupInput:
      type: object
      required:
        - group_name
      properties:
        group_name:
          type: string
          minLength: 1
          example: 'ИВТ-101'
    UserRoleEnum:
      type: string
      enum:
        - ADMIN
        - STUDENT
        - TEACHER
    UserPublicInfo:
      type: object
      required:
        - id
        - login
        - fullName
        - role
      properties:
        id:
          type: string
          readOnly: true
        login:
          type: string
          minLength: 1
        fullName:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/UserRoleEnum'
    AuthTokensInfo:
      type: object
      required:
        - expires_in
        - access_token
        - refresh_token
      properties:
        expires_in:
          type: integer
          minimum: 1
          example: 600
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    # Request/Response schemas
    CreateUserRequest:
      type: object
      required:
        - login
        - password
        - fullName
        - role
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
        fullName:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/UserRoleEnum'
    # UpdateUserRequest:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true
  responses:
    UnexpectedError:
      description: Unexpected handler error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    GeneratorBadRequest:
      description: Invalid job ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    GeneratorInternalError:
      description: Failed to load generation data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    CoreUnavailable:
      description: Core unavailable or returned an unexpected response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    CoreTimeout:
      description: Core request timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
    CorePathValidationError:
      description: Core rejected the job ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []
